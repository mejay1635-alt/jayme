services:
  - type: web
    name: web-jayme
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn web_jayme.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "web-jayme.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://web-jayme.onrender.com"
